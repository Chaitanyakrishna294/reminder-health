<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Re-MIND-eЯ</title>
<!--
  The installed app's launch screen. start_url points here, and sw.js pre-caches this
  file plus the mascot — so it opens INSTANTLY from disk, with no network involved,
  and plays while the real dashboard is server-rendered behind it. The browser keeps
  this page (and its animation) on screen until /dashboard's response arrives, which
  is exactly the wait this exists to cover. An animation cannot run any earlier than
  this: before first paint of OUR code, only the OS's static manifest splash exists.

  Self-contained on purpose: no webfonts, no framework, one image (pre-cached). It
  must render from cache alone.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
    background: #F8F9FB; color: #0F1C5A;
    padding: 24px; text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0F1C5A; color: #EAF0FF; }
  }
  .brain {
    width: 96px; height: 96px; object-fit: contain;
    animation: breathe 1.6s ease-in-out infinite;
  }
  .name { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .hint { font-size: 12px; font-weight: 600; opacity: 0.65; }
  .dots::after {
    content: ''; display: inline-block; width: 1.2em; text-align: left;
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.07) translateY(-4px); }
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
  }
  @media (prefers-reduced-motion: reduce) {
    .brain { animation: none; }
    .dots::after { content: '…'; animation: none; }
  }
  #offline { display: none; }
  #offline button {
    margin-top: 10px; min-height: 44px; padding: 0 20px;
    border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 800; font-size: 14px;
    background: #CC3D64; color: #fff;
  }
</style>
</head>
<body>
  <img class="brain" src="/mascot/reminder.png" alt="" width="96" height="96" />
  <div class="name">Re&#8209;MIND&#8209;e&#1071;</div>
  <p class="hint dots" id="opening">Opening your medications</p>
  <div id="offline" role="alert">
    <p class="hint">You're offline. Re-MIND-eЯ needs a connection to load your medications.</p>
    <button onclick="go()">Try again</button>
  </div>
<script>
  // location.replace keeps this page out of history, so Back from the dashboard
  // never lands on the splash. The page (and its animation) stays visible until
  // the dashboard's server response actually arrives.
  function go() {
    if (!navigator.onLine) {
      document.getElementById('opening').style.display = 'none';
      document.getElementById('offline').style.display = 'block';
      return;
    }
    document.getElementById('offline').style.display = 'none';
    document.getElementById('opening').style.display = '';
    location.replace('/dashboard');
  }
  window.addEventListener('online', go);
  go();
</script>
</body>
</html>

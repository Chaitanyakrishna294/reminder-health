<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Re-MIND-eЯ</title>
<!--
  The installed app's launch screen. start_url points here and sw.js pre-caches it,
  so the app OPENS INSTANTLY from disk with no network involved.

  The scene is a Gmail/Docs-class brand assembly, not a loading screen: a clock face
  draws itself, its hand sweeps one full turn and then STAYS as the pill's score line
  while the circle stretches into a capsule and tilts into the app's own Medications
  icon. One continuous 1150ms motion, then it holds. No spinner, no dots — the
  animation is the wait.

  Zero images by design: the whole splash is ~5KB of self-contained HTML, so first
  paint from cache is as fast as the platform allows.

  Cold opens forward to /dashboard?launch=1&s=<start>, where launch-handoff.tsx
  renders an IDENTICAL scene and uses `s` to SEEK the animation to wherever this page
  had got to — otherwise the story would visibly restart at the handover. Opens
  within an hour of the last completed launch skip the overlay entirely.
  THE SCENE IS DUPLICATED THERE ON PURPOSE: this file must stay self-contained to
  render from cache alone. Change one, change both — including the 1150ms duration.
-->
<script>
  // Theme before paint, from the SAME source the app uses (localStorage 'theme',
  // default light). prefers-color-scheme would contradict the in-app toggle and
  // flash the wrong theme — the app deliberately stopped seeding theme from the OS.
  try { if (localStorage.getItem('theme') === 'dark') document.documentElement.className = 'dark'; } catch (e) {}
</script>
<style>
  :root {
    --ink: #0F1C5A; --bg: #F6F2F5; --mark: #CC3D64; --score: #FFFFFF;
    --dur: 1400ms;
  }
  :root.dark { --ink: #EAF0FF; --bg: #0F1C5A; --mark: #F583A0; --score: #0F1C5A; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
    padding: 24px; text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  .mark { width: 120px; height: 120px; }
  /* transform-box: view-box so transform-origin is in viewBox units (60,60 = centre). */
  .tilt, .body, .score, .hour { transform-box: view-box; transform-origin: 60px 60px; }
  .tilt  { animation: tilt  var(--dur) both; }
  /* The hour hand exists purely for legibility: a circle with ONE sweeping line
     reads as a loading spinner, two hands at different angles read as a clock.
     It retires during the morph, leaving the minute hand to become the score line. */
  .hour  { fill: var(--ink); animation: hour var(--dur) both; }
  /* pathLength="1" normalises the outline so the draw-on works in the same units
     before AND after the geometry morph.
     NOTE: animating x/width (SVG geometry properties) via CSS needs Chrome/Firefox
     or Safari 17.4+. Older Safari degrades to "circle fills and tilts" — the mark
     still resolves, it just doesn't stretch. Acceptable; never broken. */
  .body  { fill: var(--mark); fill-opacity: 0; stroke: var(--ink); stroke-width: 6;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: body var(--dur) both; }
  .score { fill: var(--ink); animation: score var(--dur) both; }
  .name  { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; opacity: 0;
           animation: name var(--dur) both; }

  /* Beats (1400ms): 0-36% the face draws while the minute hand sweeps a full turn
     and the hour hand creeps · 36-73% the circle stretches into a capsule — past
     its final width and back, so it lands with spring rather than stopping dead —
     ink becomes fill, the hour hand retires and the minute hand grows into the
     score line · 48-100% the tilt runs UNDER the stretch (deliberately overlapped:
     two sequential moves read as a checklist, one overlapped move reads as a single
     gesture) · 73-100% the wordmark rises as its tracking settles.
     Emphasized-decelerate throughout. */
  @keyframes body {
    0%   { stroke-dashoffset: 1; x: 36px; width: 48px; fill-opacity: 0; stroke-opacity: 1;
           animation-timing-function: cubic-bezier(0.05, 0.7, 0.1, 1); }
    36%  { stroke-dashoffset: 0; x: 36px; width: 48px; fill-opacity: 0; stroke-opacity: 1;
           animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
    /* dashoffset is repeated to the end on purpose: CSS synthesises the missing
       100% frame from the base value (1), which would visibly ERASE the outline
       again while it fades out. */
    62%  { stroke-dashoffset: 0; x: 21.9px; width: 76.1px; fill-opacity: 1; stroke-opacity: 0; }
    73%  { stroke-dashoffset: 0; x: 16px;   width: 88px;   fill-opacity: 1; stroke-opacity: 0;
           animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
    86%  { stroke-dashoffset: 0; x: 18px;   width: 84px;   fill-opacity: 1; stroke-opacity: 0; }
    100% { stroke-dashoffset: 0; x: 18px;   width: 84px;   fill-opacity: 1; stroke-opacity: 0; }
  }
  @keyframes score {
    0%   { transform: rotate(0deg);   y: 40px;   height: 20px;   fill: var(--ink);
           animation-timing-function: cubic-bezier(0.05, 0.7, 0.1, 1); }
    36%  { transform: rotate(360deg); y: 40px;   height: 20px;   fill: var(--ink);
           animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
    62%  { transform: rotate(360deg); y: 37.2px; height: 39.7px; fill: var(--score); }
    73%  { transform: rotate(360deg); y: 36px;   height: 48px;   fill: var(--score); }
    100% { transform: rotate(360deg); y: 36px;   height: 48px;   fill: var(--score); }
  }
  @keyframes hour {
    0%   { transform: rotate(-60deg); opacity: 1;
           animation-timing-function: cubic-bezier(0.05, 0.7, 0.1, 1); }
    36%  { transform: rotate(-28deg); opacity: 1; }
    52%  { transform: rotate(-28deg); opacity: 0; }
    100% { transform: rotate(-28deg); opacity: 0; }
  }
  @keyframes tilt {
    0%   { transform: rotate(0deg); }
    48%  { transform: rotate(0deg); animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1); }
    100% { transform: rotate(-45deg); }
  }
  /* letter-spacing is a layout property, not a compositor one — deliberate here:
     it is one short centred word for 240ms, and the tracking settling is what
     makes the lockup feel drawn rather than dropped in. */
  @keyframes name {
    0%   { opacity: 0; transform: translateY(6px); letter-spacing: 0.35em; }
    73%  { opacity: 0; transform: translateY(6px); letter-spacing: 0.35em;
           animation-timing-function: cubic-bezier(0.05, 0.7, 0.1, 1); }
    100% { opacity: 1; transform: translateY(0);   letter-spacing: -0.02em; }
  }

  /* Reduced motion: the resolved mark, no assembly. Values mirror the 100% frames. */
  @media (prefers-reduced-motion: reduce) {
    .tilt, .body, .score, .hour, .name { animation: none; }
    .tilt  { transform: rotate(-45deg); }
    .body  { x: 18px; width: 84px; fill-opacity: 1; stroke-opacity: 0; stroke-dashoffset: 0; }
    .score { y: 36px; height: 48px; fill: var(--score); }
    .hour  { opacity: 0; }
    .name  { opacity: 1; letter-spacing: -0.02em; }
  }

  #offline, #stuck { display: none; margin-top: 4px; }
  .hint { font-size: 12px; font-weight: 600; opacity: 0.7; max-width: 20rem; }
  #offline button, #stuck button {
    margin-top: 12px; min-height: 44px; padding: 0 20px;
    border: 0; border-radius: 14px; cursor: pointer;
    font: inherit; font-weight: 800; font-size: 14px;
    background: var(--mark); color: var(--bg);
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
    <g class="tilt">
      <rect class="body" x="36" y="36" width="48" height="48" rx="24" pathLength="1" />
      <rect class="hour" x="57" y="46" width="6" height="14" rx="3" />
      <rect class="score" x="56" y="40" width="8" height="20" rx="4" />
    </g>
  </svg>
  <div class="name">Re&#8209;MIND&#8209;e&#1071;</div>

  <div id="offline" role="alert">
    <p class="hint">You're offline. Re-MIND-eЯ needs a connection to load your medications.</p>
    <button onclick="go()">Try again</button>
  </div>
  <div id="stuck" role="alert">
    <p class="hint">Taking longer than usual&hellip;</p>
    <button onclick="go()">Try again</button>
  </div>

<script>
  // location.replace keeps this page out of history, so Back from the dashboard
  // never lands on the splash.
  //
  // Cold open → /dashboard?launch=1&s=<start>: the dashboard holds an identical
  //   scene, SEEKED to this page's elapsed time, then flies the finished mark into
  //   the dock's Medications slot (launch-handoff.tsx).
  // Warm open (a launch COMPLETED within the last hour) → /dashboard, no overlay:
  //   the server is warm (~80ms TTFB vs ~4s cold, measured) and the page paints
  //   fast — let it stream in progressively like the browser.
  //   The stamp is written by launch-handoff.tsx's teardown, i.e. only when a
  //   launch actually reached a rendered page. Stamping HERE would mark stalled
  //   attempts warm, stripping the overlay from exactly the launches that need it.
  var WARM_WINDOW_MS = 60 * 60 * 1000;
  var START = Date.now();
  var stuckTimer = null;
  function go() {
    if (!navigator.onLine) {
      clearTimeout(stuckTimer);
      document.getElementById('stuck').style.display = 'none';
      document.getElementById('offline').style.display = 'block';
      return;
    }
    document.getElementById('offline').style.display = 'none';
    document.getElementById('stuck').style.display = 'none';
    // Every attempt arms a fresh stall watchdog: if the navigation hangs (cold
    // server, flaky network) this page stays visible — after 12s say so and offer
    // a retry instead of sitting on a finished logo forever. The timer dies with
    // the page once navigation commits, so it only fires while genuinely stuck.
    clearTimeout(stuckTimer);
    stuckTimer = setTimeout(function () {
      document.getElementById('stuck').style.display = 'block';
    }, 12000);
    var warm = false;
    try {
      warm = Date.now() - (Number(localStorage.getItem('remind-last-launch')) || 0) < WARM_WINDOW_MS;
    } catch (e) { /* storage unavailable: always take the splash path */ }
    location.replace(warm ? '/dashboard' : '/dashboard?launch=1&s=' + START);
  }
  // Auto-retry ONLY the offline bail-out. Re-running go() on every 'online' event
  // would abort and restart the in-flight navigation on each wifi↔cellular flap.
  window.addEventListener('online', function () {
    if (document.getElementById('offline').style.display === 'block') go();
  });
  go();
</script>
</body>
</html>

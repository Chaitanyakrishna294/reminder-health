<!doctype html>
<!--
  Offline fallback for the remote webview.

  In Capacitor server.url mode the webview loads the deployed Vercel site, so
  with no network it renders a blank white screen — which is what a user saw on
  2026-08-11 after tapping a dose notification while airplane mode was still
  recovering. MainActivity's WebViewClient swaps to this page on a main-frame
  load error instead.

  Deliberately self-contained: lives in assets/ (NOT assets/public/, which
  `npx cap sync` regenerates and .gitignore excludes), no external CSS, fonts,
  images or scripts — anything remote would fail for the exact reason this page
  is showing. Retry navigates to reminderhealth://retry, which MainActivity
  intercepts and turns into a reload of the URL that failed, so the site URL is
  not duplicated here.

  Colours are the fixed brand poster values from web/src/app/welcome/page.tsx,
  intentionally hardcoded the same way that page hardcodes them.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline</title>
    <style>
      :root {
        --ink: #0f1c5a;
        --pink: #f59fb4;
        --rose: #cc3d64;
        --paper: #fbf7f8;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--pink);
        border-radius: 28px;
        padding: 32px 24px;
        max-width: 380px;
        width: 100%;
      }
      h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
      p { margin: 0 0 20px; font-size: 15px; line-height: 1.5; opacity: 0.85; }
      a.retry {
        display: block;
        background: var(--rose);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 17px;
        padding: 16px;
        border-radius: 18px;
      }
      .note {
        margin: 18px 0 0;
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <!-- REMI — the offline slot (docs/design/REMI.md). `peaceful`, drawn at the
           registry's 120. Inlined rather than referenced: this page is shown
           precisely when nothing can be fetched, so an <img src> would render a
           broken icon at the one moment the reassurance matters.
           No shine (closed eyes carry none) and no size floors needed at 120. -->
      <svg class="remi" viewBox="0 0 512 512" width="120" height="120" aria-hidden="true">
        <g fill="#F26B8A">
          <ellipse cx="256" cy="256" rx="150" ry="120"/>
          <circle cx="256" cy="161" r="68"/><circle cx="182" cy="179" r="68"/>
          <circle cx="136" cy="227" r="68"/><circle cx="136" cy="285" r="68"/>
          <circle cx="182" cy="333" r="68"/><circle cx="256" cy="351" r="68"/>
          <circle cx="330" cy="333" r="68"/><circle cx="376" cy="285" r="68"/>
          <circle cx="376" cy="227" r="68"/><circle cx="330" cy="179" r="68"/>
        </g>
        <g fill="none" stroke="#CC3D64" stroke-width="8.3" stroke-linecap="round">
          <path d="M174.7 137.6 Q146.9 143.9 140.6 171.7"/>
          <path d="M337.3 137.6 Q365.1 143.9 371.4 171.7"/>
        </g>
        <g transform="rotate(4 256 280)">
          <g class="remi-blush" fill="#FDEEF2">
            <ellipse cx="131.95" cy="290" rx="26.4" ry="14.5"/>
            <ellipse cx="380.05" cy="290" rx="26.4" ry="14.5"/>
          </g>
          <g fill="none" stroke="#0F1C5A" stroke-width="8.3" stroke-linecap="round">
            <path d="M169.9 258.2 Q198.6 285.6 227.3 258.2"/>
            <path d="M284.7 258.2 Q313.4 285.6 342.1 258.2"/>
          </g>
          <g fill="none" stroke="#CC3D64" stroke-width="9.5" stroke-linecap="round">
            <path d="M237.2 318.7 Q256 328.5 274.8 318.7"/>
          </g>
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>Re-MIND-e&#1071; needs a connection to load your medicines, care circle and vault.</p>
      <a class="retry" href="reminderhealth://retry">Retry</a>
      <p class="note">
        Your reminders still work. Dose alarms are stored on this phone and will
        ring on time with no connection at all.
      </p>
    </main>
  </body>
</html>

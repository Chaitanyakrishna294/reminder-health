apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

// Release signing credentials, loaded from a gitignored file that lives outside
// version control. The keystore itself is kept OUTSIDE the repository entirely
// (see keystore.properties -> storeFile) so it cannot be committed even by a
// careless `git add -A`.
//
// Absent on a fresh clone or in CI, and that is deliberate: the debug build must
// still work for anyone without the signing key. Only `assembleRelease` needs it,
// and it fails loudly rather than silently producing an unsigned or
// debug-signed artifact.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.reminderhealth.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.reminderhealth.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // CLAUDE.md release requirement. R8 also shrinks resources, which
            // matters less than the obfuscation but is free once minify is on.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation project(':capacitor-android')

    // M2 alarm core — local schedule store (see BRIDGE_CONTRACT.md).
    // core-ktx is declared explicitly (not relied on transitively via appcompat)
    // because DoseNotifications uses NotificationCompat directly.
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    // Offline action queue (step 6): encrypted session storage + a
    // connectivity-constrained one-shot retry job (never a periodic poll).
    implementation "androidx.security:security-crypto:$securityCryptoVersion"
    // M3 encryption at rest for schedule.db (drug names, dosages, timings — health data).
    // sentry-android-CORE, not sentry-android. The latter is a bundle that drags
    // in sentry-android-ndk and ships libsentry.so, whose C code killed this app
    // with SIGBUS on the vivo (see variables.gradle). Core is pure JVM, which is
    // all the alarm core needs — Kotlin exceptions, not native signals.
    implementation "io.sentry:sentry-android-core:$sentryAndroidVersion"
    implementation "net.zetetic:sqlcipher-android:$sqlcipherVersion"
    implementation "androidx.sqlite:sqlite:$androidxSqliteVersion"
    implementation "androidx.work:work-runtime-ktx:$workVersion"
    testImplementation "junit:junit:$junitVersion"
    // CalculateNextReminderTest.kt reads the JSON fixture. Android's org.json
    // classes are stubbed out (throw at runtime) for local, non-instrumented
    // JVM unit tests — this standalone artifact is the standard workaround.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

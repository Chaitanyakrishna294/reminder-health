ext {
    minSdkVersion = 23
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'

    // M2 alarm core — not in the default Capacitor template.
    // Room MUST be 2.7.0+ here: 2.6.1's bundled annotation-processor metadata
    // reader only understands Kotlin metadata up to version 2.0.0, and this
    // project is on Kotlin 2.1.0 (see android/build.gradle) — kapt fails on
    // MedicationDao's suspend functions with "Provided Metadata instance has
    // version 2.1.0, while maximum supported version is 2.0.0" on anything
    // older. Room 2.7.0 updated that reader; don't downgrade this.
    roomVersion = '2.7.1'
    coroutinesVersion = '1.9.0'
    // 1.1.0-alpha06 despite the alpha label, and NOT 1.0.0: the MasterKey.Builder
    // API does not exist in 1.0.0 at all (it has the older, now-deprecated
    // MasterKeys alias API, which fails to compile against this code), and 1.0.0
    // also carries keystore bugs on newer Android that the 1.1.0 line fixed. The
    // 1.1.0 alphas are what production apps actually ship for this library.
    securityCryptoVersion = '1.1.0-alpha06'
    workVersion = '2.9.1'

    // M3 encryption at rest. `sqlcipher-android` is the CURRENT artifact — NOT the
    // older `android-database-sqlcipher`, which is end-of-life and whose classes
    // live under a different package (net.sqlcipher.* vs net.zetetic.database.*).
    // Room talks to it through androidx.sqlite's SupportSQLiteOpenHelper, so the
    // DAOs and entities are untouched by encryption.
    sqlcipherVersion = '4.6.1'
    androidxSqliteVersion = '2.4.0'

    // M3 crash reporting for the alarm core.
    //
    // Used as `sentry-android-CORE` (see app/build.gradle), never the
    // `sentry-android` bundle and never any replay/UI-capturing variant — this
    // app's screen is a list of someone's medications.
    //
    // The bundle pulls in sentry-android-ndk, and on the vivo test device that
    // native layer killed the app twice within three minutes:
    //   Fatal signal 7 (SIGBUS), BUS_ADRALN, in libsentry.so
    //   at sentry_add_breadcrumb+140, thread SentryExecutorS
    // SIGBUS is fatal to the whole process, so crash reporting was terminating
    // the alarm core it exists to watch — at arbitrary moments, not just at
    // launch. The fault address decoded as ASCII digits, i.e. a text buffer being
    // dereferenced as a pointer: memory corruption inside Sentry's own C code,
    // not something callable code could guard against.
    //
    // Note it crashed in BREADCRUMB handling even though maxBreadcrumbs = 0 on
    // the JVM side — the NDK layer keeps its own native buffer via scope sync, so
    // a JVM option never reached it. Removing the artifact is the only fix that
    // actually holds; a runtime flag leaves the .so loaded and the code reachable.
    sentryAndroidVersion = '7.20.1'
}
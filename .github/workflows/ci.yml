name: CI

on:
  push:
  pull_request:

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  web-schedule-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      # No test runner/script exists for web/ (see CLAUDE.md) — these are bare
      # node:assert scripts, one process per file, run the same way a
      # developer runs them locally.
      - working-directory: web
        run: |
          for f in src/lib/schedule/*.test.ts src/lib/*.test.ts; do
            echo "::group::$f"
            node --experimental-strip-types "$f"
            echo "::endgroup::"
          done
